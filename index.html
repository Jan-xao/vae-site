<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星光迷宫大冒险</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#343a7d,#11152e 65%);color:#fff;font-family:system-ui;text-align:center;display:grid;place-items:center;padding:24px}.box{width:min(540px,100%);background:#ffffff10;border:1px solid #ffffff30;border-radius:28px;padding:24px;box-shadow:0 20px 60px #0005}h1{margin:4px;font-size:clamp(26px,7vw,38px)}p{color:#cdd4ff}.stats{display:flex;justify-content:space-around;margin:18px 0;color:#f8de92;font-weight:bold}.grid{display:grid;gap:4px;margin:auto;max-width:410px;aspect-ratio:1}.cell{background:#252c55;border-radius:5px;display:grid;place-items:center;font-size:clamp(18px,5vw,29px)}.wall{background:#5663a3}.controls{display:grid;grid-template-columns:repeat(3,55px);gap:6px;justify-content:center;margin:20px auto 0}button{background:#7584ed;color:white;border:0;border-radius:12px;font-size:20px;padding:12px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.95)}.wide{font-size:15px;margin-top:14px;padding:10px 20px;background:#ffffff20}.message{min-height:24px;color:#ffdc7a} .empty{visibility:hidden}</style><main class="box"><div>✦ &nbsp; 迷 你 冒 险 &nbsp; ✦</div><h1>星光迷宫大冒险</h1><p>收集全部星星，找到出口，开启下一关！</p><div class="stats"><span id="level"></span><span id="stars"></span><span id="steps"></span></div><div id="grid" class="grid" aria-label="迷宫"></div><p class="message" id="message">用方向键或下方按钮移动</p><div class="controls"><span></span><button data-d="0,-1" aria-label="上">▲</button><span></span><button data-d="-1,0" aria-label="左">◀</button><button data-d="0,1" aria-label="下">▼</button><button data-d="1,0" aria-label="右">▶</button></div><button class="wide" id="reset">重新开始本关</button></main><script>const maps=[["#########","#P..#..E#","#.#.#.#.#","#.*...#.#","###.###.#","#...#...#","#.#...#*#","#.......#","#########"],["#########","#P....#E#","#.###.#.#","#...#...#","###.#.###","#*..#...#","#.#####.#","#...*...#","#########"],["#########","#P#...#E#","#.#.#.#.#","#...#...#","#.#####.#","#...#...#","###.#.###","#*...*..#","#########"]];let level=0,board,x,y,count,steps,done;const g=document.querySelector('#grid'),msg=document.querySelector('#message');function start(){board=maps[level].map(s=>s.split(''));count=0;steps=0;done=false;for(let j=0;j<9;j++)for(let i=0;i<9;i++){if(board[j][i]==='P'){x=i;y=j;board[j][i]='.'}if(board[j][i]==='*')count++}msg.textContent='用方向键或下方按钮移动';render()}function render(){document.querySelector('#level').textContent='第 '+(level+1)+' / '+maps.length+' 关';document.querySelector('#stars').textContent='星星 '+count;document.querySelector('#steps').textContent='步数 '+steps;g.style.gridTemplateColumns='repeat(9,1fr)';g.replaceChildren();board.forEach((row,j)=>row.forEach((v,i)=>{const c=document.createElement('div');c.className='cell '+(v==='#'?'wall':'');c.textContent=(i===x&&j===y)?'🧑‍🚀':v==='*'?'⭐':v==='E'?'🚪':'';g.append(c)}))}function move(dx,dy){if(done)return;let nx=x+dx,ny=y+dy;if(board[ny]?.[nx]==null||board[ny][nx]==='#')return;if(board[ny][nx]==='E'&&count){msg.textContent='先收集所有星星，再去出口！';return}x=nx;y=ny;steps++;if(board[y][x]==='*'){count--;board[y][x]='.';msg.textContent=count?'继续寻找星星！':'星星收集完成，去出口吧！'}if(board[y][x]==='E'){done=true;if(level<maps.length-1){msg.textContent='通关成功！即将进入下一关';setTimeout(()=>{level++;start()},1000)}else msg.textContent='🎉 恭喜！你完成了全部关卡！'}render()}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let [dx,dy]=b.dataset.d.split(',').map(Number);move(dx,dy)});document.addEventListener('keydown',e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});document.querySelector('#reset').onclick=start;start();</script></html>
